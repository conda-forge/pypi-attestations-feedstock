schema_version: 1

context:
  version: "0.0.31"

package:
  name: pypi-attestations
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pypi-attestations/pypi_attestations-${{ version }}.tar.gz
  sha256: 5a2473aca7d7f65caf2c3a985691c5cf9264a97fa68c98fbae6e96320bcc7c9a

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - pypi-attestations = pypi_attestations._cli:main
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - cryptography
    - packaging
    - pyasn1 >=0.6,<1
    - pydantic >=2.10.0
    - requests
    - rfc3986
    - sigstore >=4.5,<5
    - sigstore-models

tests:
  - python:
      imports:
        - pypi_attestations
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - pypi-attestations --help

about:
  homepage: https://pypi.org/project/pypi-attestations
  repository: https://github.com/pypi/pypi-attestations
  summary: Convert between Sigstore bundles and PEP 740 attestations
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jezdez
